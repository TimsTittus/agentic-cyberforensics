version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: bruce_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - bruce_network

  neo4j:
    image: neo4j:5-community
    container_name: bruce_neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER}/${NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_dbms_security_procedures_allowlist: apoc.*
    ports:
      - "7474:7474"   # HTTP browser
      - "7687:7687"   # Bolt protocol
    volumes:
      - neo4j_data:/data
      - neo4j_plugins:/plugins
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u ${NEO4J_USER} -p ${NEO4J_PASSWORD} 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s
    networks:
      - bruce_network

  qdrant:
    image: qdrant/qdrant:v1.8.4
    container_name: bruce_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # HTTP REST
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333'"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - bruce_network

  redis:
    image: redis:7-alpine
    container_name: bruce_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - bruce_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bruce_backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - evidence_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bruce_network

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bruce_celery_worker
    restart: unless-stopped
    env_file:
      - .env
    command: ["celery", "-A", "app.core.celery_app", "worker", "--loglevel=info", "-Q", "evidence"]
    volumes:
      - ./backend/app:/app/app
      - evidence_storage:/app/storage
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - bruce_network

  frontend:
    image: node:20-alpine
    container_name: bruce_frontend
    working_dir: /app
    command: ["sh", "-c", "echo 'Frontend placeholder — Phase 3' && sleep infinity"]
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
    networks:
      - bruce_network

volumes:
  postgres_data:
  neo4j_data:
  neo4j_plugins:
  qdrant_data:
  redis_data:
  evidence_storage:

networks:
  bruce_network:
    driver: bridge